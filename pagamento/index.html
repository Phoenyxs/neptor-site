<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pagamento · Neptor chat</title>
<meta name="theme-color" content="#0C0D12" />
<link rel="icon" href="../neptor-icon.ico" sizes="any" />
<link rel="icon" href="../neptor-planet.svg" type="image/svg+xml" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0C0D12; color: #D6DAE6; font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 24px; border-bottom: 1px solid #23273A; margin-bottom: 32px; }
  header a { color: #8FB4FF; text-decoration: none; font-weight: 600; }
  header nav a { margin-left: 16px; font-weight: 500; color: #A9B0C4; }
  header nav a[aria-current] { color: #FFFFFF; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .wordmark { display: inline-flex; align-items: baseline; gap: 5px; font-family: Arial, sans-serif; font-weight: 700; background: linear-gradient(90deg, #4F8CFF, #E8B95B); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wordmark b { letter-spacing: 0.16em; font-size: 1.1rem; }
  .wordmark small { letter-spacing: 0.04em; font-size: 0.78rem; font-weight: 700; }
  .brand img { width: 26px; height: 26px; }
  h1 { color: #FFFFFF; font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
  h2 { color: #FFFFFF; font-size: 1.25rem; margin: 40px 0 12px; }
  h3 { color: #FFFFFF; font-size: 1.05rem; margin: 28px 0 8px; }
  strong { color: #FFFFFF; }
  a { color: #8FB4FF; }
  ul { padding-left: 22px; }
  li { margin: 6px 0; }
  code { background: #171A26; padding: 1px 6px; border-radius: 4px; }
  .table { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
  th, td { border: 1px solid #23273A; padding: 10px 12px; text-align: left; vertical-align: top; }
  th { background: #141726; color: #FFFFFF; }
</style>
</head>
<body>
<main>
<header>
  <a class="brand" href="../"><img src="../neptor-planet.svg" alt="" /><span class="wordmark"><b>NEPTOR</b><small>chat</small></span></a>
  <nav><a href="../privacidade/">Política de privacidade</a><a href="../termos/">Termos de uso</a></nav>
</header>
<h1>Pagamento</h1>
<p id="status">Conferindo o pagamento…</p>
<p>Pode fechar esta página e voltar ao Neptor: o item ou o Neptor+ aparece no app sozinho assim que o pagamento é
confirmado. Se pagou com cartão e algo não chegou em alguns minutos, fale com eliasborgeser@gmail.com.</p>
<script>
(function () {
  var status = document.getElementById('status');
  var params = new URLSearchParams(location.search);
  var body = { order_nsu: params.get('order_nsu'), slug: params.get('slug'), transaction_nsu: params.get('transaction_nsu') };
  if (!body.order_nsu || !body.slug || !body.transaction_nsu) {
    status.textContent = 'Pagamento recebido pela InfinitePay. Volte ao Neptor para ver a sua compra.';
    return;
  }
  fetch("https://api.neptorchat.com.br/api/payments/confirm", { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      status.textContent = data.status === 'paid'
        ? 'Pagamento confirmado! Já pode voltar ao Neptor.'
        : 'Recebemos a sua volta. Assim que a InfinitePay aprovar o pagamento, a compra aparece no Neptor.';
    })
    .catch(function () {
      status.textContent = 'Não deu para conferir daqui, mas o pagamento também é avisado direto ao Neptor. Volte ao app.';
    });
})();
</script>
</main>
</body>
</html>
