<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Neptor: esfera grafite com luz azul de Netuno e um anel azul inclinado. Fonte do ícone do app (npm run icons). -->
  <defs>
    <radialGradient id="body" cx="66%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#9CA5B3"/>
      <stop offset="12%" stop-color="#5E6574"/>
      <stop offset="34%" stop-color="#272A33"/>
      <stop offset="64%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0F"/>
    </radialGradient>
    <radialGradient id="glow" cx="4%" cy="92%" r="92%">
      <stop offset="0%" stop-color="#3A8BFF" stop-opacity="0.95"/>
      <stop offset="34%" stop-color="#2459F0" stop-opacity="0.55"/>
      <stop offset="62%" stop-color="#2459F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="58%" cy="116%" r="52%">
      <stop offset="0%" stop-color="#5A35F2" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#3F26D0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3F26D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1C4FE6"/>
      <stop offset="45%" stop-color="#2A66FF"/>
      <stop offset="82%" stop-color="#4A92FF"/>
      <stop offset="100%" stop-color="#2E6BFF"/>
    </linearGradient>
    <clipPath id="back"><rect x="-60" y="-60" width="376" height="190"/></clipPath>
    <clipPath id="front"><rect x="-60" y="130" width="376" height="190"/></clipPath>
  </defs>
  <g transform="rotate(-31 128 130)" clip-path="url(#back)">
    <ellipse cx="128" cy="130" rx="104" ry="21" fill="none" stroke="url(#ring)" stroke-width="7"/>
  </g>
  <circle cx="128" cy="130" r="74" fill="url(#body)"/>
  <circle cx="128" cy="130" r="74" fill="url(#glow)"/>
  <circle cx="128" cy="130" r="74" fill="url(#deep)"/>
  <circle cx="128" cy="130" r="73.5" fill="none" stroke="#7FA8FF" stroke-opacity="0.1" stroke-width="1"/>
  <g transform="rotate(-31 128 130)" clip-path="url(#front)">
    <ellipse cx="128" cy="130" rx="104" ry="21" fill="none" stroke="url(#ring)" stroke-width="7"/>
  </g>
</svg>
